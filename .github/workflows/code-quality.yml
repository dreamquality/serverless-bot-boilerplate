name: Code Quality

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=text --coverageReporters=lcov
      
      - name: Check coverage thresholds
        run: |
          node -e "
          const fs = require('fs');
          const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json'));
          const total = coverage.total;
          
          const thresholds = {
            statements: 70,
            branches: 60,
            functions: 70,
            lines: 70
          };
          
          let failed = false;
          for (const [key, threshold] of Object.entries(thresholds)) {
            const actual = total[key].pct;
            console.log(\`\${key}: \${actual}% (threshold: \${threshold}%)\`);
            if (actual < threshold) {
              console.error(\`❌ \${key} coverage \${actual}% is below threshold \${threshold}%\`);
              failed = true;
            }
          }
          
          if (failed) process.exit(1);
          console.log('✅ All coverage thresholds met');
          " || echo "Coverage check skipped (no coverage data)"
      
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint with annotations
        run: |
          npm run lint -- --format json --output-file eslint-report.json || true
          npm run lint
      
      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          git grep -n "TODO\|FIXME" src/ || echo "No TODO/FIXME found"
      
      - name: Check file sizes
        run: |
          echo "Checking for large files..."
          find src/ -type f -size +100k -exec ls -lh {} \; || echo "No large files found"
      
      - name: Check for console.log statements
        run: |
          echo "Checking for console.log in production code..."
          if grep -r "console.log" src/ --exclude-dir=__tests__ --exclude="*.test.ts" --exclude="logger.ts" | grep -v "logger"; then
            echo "⚠️  Found console.log statements in production code"
            exit 1
          fi
          echo "✅ No console.log in production code"
        continue-on-error: true

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Check for outdated dependencies
        run: |
          npm outdated || true
      
      - name: Check package-lock.json
        run: |
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json is missing"
            exit 1
          fi
          echo "✅ package-lock.json exists"
      
      - name: Validate package.json
        run: |
          node -e "
          const pkg = require('./package.json');
          if (!pkg.name || !pkg.version || !pkg.license) {
            console.error('❌ package.json missing required fields');
            process.exit(1);
          }
          console.log('✅ package.json is valid');
          "

  typescript-strict:
    name: TypeScript Strict Mode
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check TypeScript strict mode
        run: |
          if grep -q '"strict": true' tsconfig.json; then
            echo "✅ TypeScript strict mode is enabled"
          else
            echo "⚠️  TypeScript strict mode is not fully enabled"
          fi
      
      - name: Type check
        run: npm run type-check
      
      - name: Build with strict checks
        run: npm run build
