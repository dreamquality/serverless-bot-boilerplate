name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint
      
      - name: Run type check
        run: npm run type-check
      
      - name: Run tests
        run: npm test -- --coverage
      
      - name: Upload coverage reports
        if: matrix.node-version == '20.x'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Build project
        run: npm run build
      
      - name: Check for build artifacts
        run: |
          if [ ! -d "dist" ] && [ ! -f "tsconfig.tsbuildinfo" ]; then
            echo "Build completed successfully"
          fi

  shell-script-validation:
    name: Shell Script Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      
      - name: Validate setup.sh
        run: |
          shellcheck setup.sh || true
          bash -n setup.sh
      
      - name: Validate update-env.sh
        run: |
          shellcheck update-env.sh || true
          bash -n update-env.sh
      
      - name: Check script permissions
        run: |
          test -x setup.sh
          test -x update-env.sh

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate || true
      
      - name: Check for known vulnerabilities
        run: |
          npm audit --json > audit-report.json || true
          cat audit-report.json

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check README exists
        run: test -f README.md
      
      - name: Check required documentation files
        run: |
          test -f CONTRIBUTING.md
          test -f CHANGELOG.md
          test -f LICENSE
          test -f .env.example
      
      - name: Validate markdown files
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: node_modules
        continue-on-error: true

  deployment-ready:
    name: Deployment Ready Check
    runs-on: ubuntu-latest
    needs: [quality-gates, shell-script-validation]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Vercel configuration
        run: test -f vercel.json
      
      - name: Check Supabase configuration
        run: |
          test -f supabase/config.toml
          test -f supabase/functions/telegram-bot/index.ts
      
      - name: Check TypeScript configuration
        run: test -f tsconfig.json
      
      - name: Check package.json has required scripts
        run: |
          node -e "
          const pkg = require('./package.json');
          const required = ['dev', 'build', 'test', 'lint', 'type-check'];
          const missing = required.filter(s => !pkg.scripts[s]);
          if (missing.length) {
            console.error('Missing scripts:', missing);
            process.exit(1);
          }
          console.log('All required scripts present');
          "
      
      - name: Deployment ready
        run: echo "✅ All deployment checks passed"
